<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Math Memory Game</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="./styles.css" />
    <link rel="stylesheet" href="./landing.css" />
  </head>
  <body>
    <main class="home">
      <h1 class="home-title">Math <span class="grad">Memory</span> Game</h1>

      <nav class="home-tasks">
        <a class="tile tile--mult" href="./multiplication.html">
          <span class="tile-art" aria-hidden="true">7 × 8</span>
          <span class="tile-name">Multiplication</span>
          <span class="tile-meta">5 minutes</span>
        </a>

        <a class="tile tile--frac" href="./fraction.html">
          <span class="tile-art" aria-hidden="true">
            <span class="frac"><span class="n">3</span><span class="d">8</span></span>
            <span class="tile-vs">vs</span>
            <span class="frac"><span class="n">5</span><span class="d">8</span></span>
          </span>
          <span class="tile-name">Fraction Comparison</span>
          <span class="tile-meta">5 minutes</span>
        </a>

        <a class="tile tile--test tile--wide" href="./test.html">
          <span class="tile-name">Pre / Post Test</span>
          <span class="tile-meta">Number line · Memory</span>
        </a>
      </nav>
    </main>
  </body>
